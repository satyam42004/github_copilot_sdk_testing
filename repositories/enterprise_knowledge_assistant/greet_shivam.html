<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting for Shivam</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .greeting-container {
            text-align: center;
            background-color: white;
            padding: 50px 60px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            font-size: 48px;
            margin: 0 0 20px 0;
        }
        
        p {
            color: #666;
            font-size: 20px;
            margin: 0;
            line-height: 1.5;
        }
        
        .emoji {
            font-size: 60px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="greeting-container">
        <h1>Hello Shivam! 👋</h1>
        <p>Welcome! It's great to have you here.</p>
        <p>You have an awesome friend who wanted to greet you! 😊</p>
        <div class="emoji">🎉</div>
    </div>
</body>
</html>
