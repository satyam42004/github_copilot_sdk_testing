[project]
name = "github-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satyam", email = "satyamthakur42004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=2.0.0",
    "arize-phoenix-otel>=0.16.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "github-copilot-sdk[telemetry]>=1.0.11",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.52.4",
]


[tool.uv]
package = false

[project.scripts]
github-copilot-sdk = "github_copilot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
